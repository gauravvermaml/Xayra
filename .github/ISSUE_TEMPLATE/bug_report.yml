name: Bug report
description: Something in Xayra doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please don't include your own notes, recordings, transcripts, to-dos or
        other personal data. Describe the problem with made-up examples.
        Security problems: use "Report a security problem" instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Xayra
        2. Tap ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Xayra version
      description: Settings shows the version, for example 2.0.0 (52).
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Pixel 9, Android 15
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no personal notes, recordings or other private data.
          required: true
