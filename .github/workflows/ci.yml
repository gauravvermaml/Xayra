# Typecheck, unit tests and repository policy checks.
# Never builds, signs, submits or uploads anything, and uses no secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Dependency install scripts (native downloads) aren't needed for
      # tsc/Jest and don't run here; patch-package then runs explicitly so a
      # patch that no longer applies fails the build.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply patches
        run: npx patch-package --error-on-fail

      - name: Repository policy
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_BASE_REF}" = "main" ]; then
            node scripts/ci/checkRepoPolicy.js --require-closed
          else
            node scripts/ci/checkRepoPolicy.js
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest --ci
